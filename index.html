hôi dưới dạng phoi nhờ dụng cụ cắt và máy cắt","Dùng ngoại lực tác dụng lên vật liệu dẻo","Nung nóng chảy mép ghép nối của kim loại"],"correctIndex":1,"explanation":"Gia công cắt gọt là thực hiện việc lấy đi một phần kim loại của phôi dưới dạng phoi nhờ dụng cụ cắt và máy cắt kim loại để tạo ra chi tiết có hình dạng, kích thước theo yêu cầu."},{"id":"nb-06","code":"NB-06","level":"biet","topic":"Luyện kim, cơ khí","question":"Thép được sản xuất chủ yếu từ nguyên liệu nào và bằng các loại lò nào?","options":["Quặng sắt bằng lò cao","Gang bằng lò oxi hoặc lò hồ quang điện","Than đá bằng lò nung","Đồng thau bằng lò đúc"],"correctIndex":1,"explanation":"Thép được sản xuất từ nguyên liệu gang bằng lò thổi oxi (lò LD) hoặc lò hồ quang điện."},{"id":"nb-07","code":"NB-07","level":"biet","topic":"Luyện kim, cơ khí","question":"Bản chất của công nghệ gia công áp lực là gì?","options":["Nấu chảy kim loại rồi rót vào khuôn có hình dáng định sẵn","Cắt bỏ lớp kim loại thừa trên bề mặt phôi","Dựa vào tính dẻo của kim loại, dùng ngoại lực tác dụng làm kim loại biến dạng theo hình dáng yêu cầu","Nối các thanh kim loại lại với nhau bằng nhiệt độ cao"],"correctIndex":2,"explanation":"Gia công áp lực là công nghệ dựa vào tính dẻo của kim loại, dùng ngoại lực của thiết bị làm cho kim loại biến dạng theo hình dáng yêu cầu."},{"id":"nb-08","code":"NB-08","level":"biet","topic":"Điện - điện tử","question":"Động cơ điện gồm có mấy bộ phận chính?","options":["2 bộ phận chính","3 bộ phận chính","4 bộ phận chính","5 bộ phận chính"],"correctIndex":0,"explanation":"Động cơ điện có 2 bộ phận chính là: Stato (phần đứng yên) và Roto (phần quay)."},{"id":"nb-09","code":"NB-09","level":"biet","topic":"Luyện kim, cơ khí","question":"Quá trình luyện gang, thép thường phát sinh những tác nhân gây ô nhiễm nào?","options":["Khí CO2","Bụi kim loại","Tiếng ồn công nghiệp","Cả 3 tác nhân trên"],"correctIndex":3,"explanation":"Lò luyện gang, thép xả ra lượng lớn khí CO2, phát sinh nhiều bụi và tiếng ồn lớn ảnh hưởng đến môi trường."},{"id":"nb-10","code":"NB-10","level":"biet","topic":"Điện - điện tử","question":"Ưu điểm nổi bật giúp đèn LED được sử dụng rộng rãi hiện nay là gì?","options":["Tiết kiệm điện năng","Hiệu quả chiếu sáng cao","Tuổi thọ cao","Cả 3 ưu điểm trên"],"correctIndex":3,"explanation":"Đèn LED có đầy đủ ưu điểm: siêu tiết kiệm điện, hiệu suất phát quang cao, tuổi thọ lên tới hàng chục nghìn giờ."},{"id":"nb-11","code":"NB-11","level":"biet","topic":"Luyện kim, cơ khí","question":"Bản chất của công nghệ hàn là gì?","options":["Tạo mối liên kết cố định giữa các chi tiết kim loại bằng cách nung nóng chảy ở vùng tiếp xúc, khi nguội kết thành một khối","Lấy đi lượng dư kim loại nhờ dao tiện hoặc máy phay","Dùng búa đập làm biến dạng thanh kim loại","Đổ dung dịch kim loại lỏng vào khuôn cát"],"correctIndex":0,"explanation":"Công nghệ hàn tạo mối liên kết cố định giữa các chi tiết kim loại bằng cách nung nóng chỗ nối đến trạng thái hàn (chảy hoặc dẻo), sau đó kết tinh tạo mối hàn."},{"id":"nb-12","code":"NB-12","level":"biet","topic":"Điện - điện tử","question":"Hai bộ phận chính của động cơ điện xoay chiều là:","options":["Stato và Roto","Piston và Xi lanh","Vỏ máy và Cực từ","Trục cán và Ổ bi"],"correctIndex":0,"explanation":"Stato là phần đứng yên tạo từ trường, Roto là phần quay chuyển động."},{"id":"nb-13","code":"NB-13","level":"biet","topic":"Điện - điện tử","question":"Nhược điểm lớn nhất của bóng đèn sợi đốt là gì?","options":["Tiêu thụ nhiều điện năng và tỏa nhiều nhiệt","Hiệu quả chiếu sáng thấp (phần lớn điện năng biến thành nhiệt năng)","Tuổi thọ thấp (khoảng 1.000 giờ)","Cả 3 nhược điểm trên"],"correctIndex":3,"explanation":"Đèn sợi đốt tiêu thụ nhiều điện, phần lớn biến thành nhiệt nên hiệu suất phát sáng thấp và tuổi thọ ngắn."},{"id":"nb-14","code":"NB-14","level":"biet","topic":"Điện - điện tử","question":"Đâu là các nguồn năng lượng chính được dùng để sản xuất điện năng phổ biến?","options":["Thủy điện (năng lượng nước)","Nhiệt điện (than oth, mạng di động","Cáp đồng trục, cáp quang","Đường dây điện thoại bàn","Cáp mạng LAN xoắn đôi"],"correctIndex":0,"explanation":"Truyền thông không dây bao gồm: công nghệ Wi-Fi, Bluetooth và mạng di động (3G, 4G, 5G,...)."},{"id":"nb-31","code":"NB-31","level":"biet","topic":"Luyện kim, cơ khí","question":"Kĩ sư luyện kim là người tốt nghiệp đại học chuyên ngành gì?","options":["Kĩ thuật vật liệu kim loại","Kĩ thuật điện lạnh","Kĩ thuật hóa mỹ phẩm","Kĩ thuật lâm sinh"],"correctIndex":0,"explanation":"Kĩ sư luyện kim tốt nghiệp trường đại học kĩ thuật ngành Kĩ thuật vật liệu kim loại."},{"id":"nb-32","code":"NB-32","level":"biet","topic":"Luyện kim, cơ khí","question":"Phương pháp gia công nào cho phép chế tạo chi tiết có độ chính xác và độ nhẵn bóng bề mặt cao nhất?","options":["Đúc khuôn cát thô","Gia công cắt gọt","Rèn tự do","Hàn tay"],"correctIndex":1,"explanation":"Gia công cắt gọt (tiện, phay, mài,...) giúp chi tiết máy đạt kích thước chính xác và độ nhẵn bóng bề mặt cao."},{"id":"nb-33","code":"NB-33","level":"biet","topic":"Luyện kim, cơ khí","question":"Phương pháp nào sau đây làm cho phôi kim loại đi qua khe hở giữa hai trục quay ngược chiều nhau?","options":["Kéo kim loại","Cán kim loại","Rèn khuôn","Dập vuốt"],"correctIndex":1,"explanation":"Cán là cho phôi đi qua khe hở giữa hai trục cán quay ngược chiều nhau, làm giảm chiều dày và tăng chiều dài của phôi."},{"id":"nb-34","code":"NB-34","level":"biet","topic":"Luyện kim, cơ khí","question":"Phương pháp làm phôi kéo dài đi qua lỗ khuôn để tạo sản phẩm dạng thỏi hoặc ống có chiều dài tùy ý là:","options":["Cán kim loại","Kéo kim loại","Gia công phay","Đúc áp lực"],"correctIndex":1,"explanation":"Kéo kim loại là sự kéo dài phôi qua lỗ khuôn kéo để chế tạo sản phẩm thỏi, dây, ống có chiều dài liên tục."},{"id":"nb-35","code":"NB-35","level":"biet","topic":"Điện - điện tử","question":"Công nghệ điều khiển và tự động hóa có vai trò chính là gì trong các nhà máy hiện đại?","options":["Thay thế hoàn toàn kim i học là:","options":["Công nghệ hàn","Công nghệ đúc","Công nghệ tiện phay","Công nghệ cán kéo"],"correctIndex":0,"explanation":"Công nghệ thứ 5 trong mục I là công nghệ hàn kim loại."},{"id":"th-11","code":"TH-11","level":"hieu","topic":"Luyện kim, cơ khí","question":"Vì sao sau khi đúc kim loại, nhiều sản phẩm vẫn cần trải qua gia công cắt gọt?","options":["Để tăng trọng lượng cho sản phẩm","Để nâng cao độ chính xác kích thước và độ bóng bề mặt của chi tiết","Để làm biến dạng nguội kim loại","Để sản phẩm có thể dẫn điện tốt hơn"],"correctIndex":1,"explanation":"Sản phẩm đúc thô gọi là phôi đúc, cần gia công cắt gọt để đạt độ chính xác cao và độ nhẵn bóng theo bản vẽ thiết kế."},{"id":"th-12","code":"TH-12","level":"hieu","topic":"Luyện kim, cơ khí","question":"Điểm khác biệt cốt lõi giữa \"Gia công cắt gọt\" và \"Gia công áp lực\" là gì?","options":["Cắt gọt sinh ra phoi thừa bỏ đi, còn gia công áp lực tận dụng tính dẻo biến dạng không sinh phoi","Cắt gọt dùng kim loại lỏng, gia công áp lực dùng kim loại rắn","Cắt gọt chỉ làm được với nhôm, gia công áp lực chỉ làm được với sắt","Gia công áp lực không dùng đến máy móc"],"correctIndex":0,"explanation":"Gia công cắt gọt lấy đi phần kim loại thừa dưới dạng phoi; còn gia công áp lực dùng lực biến dạng dẻo kim loại thành hình dáng mong muốn mà không tách bỏ phoi."},{"id":"th-13","code":"TH-13","level":"hieu","topic":"Điện - điện tử","question":"Vì sao đèn LED tiết kiệm điện năng hơn rất nhiều so với đèn sợi đốt?","options":["Vì đèn LED đốt cháy khí trơ phát quang","Vì đèn LED chuyển hóa trực tiếp điện năng thành quang năng qua diode mà không sinh nhiều nhiệt lượng dư thừa","Vì đèn LED sử dụng dòng điện áp siêu cao","Vì đèn LED có vỏ bằng thủy tinh dày hơn"],"correctIndex":1,"explanation":"Đèn sợi đốt nung nóng dây tóc phát sáng nên 90-95% năng lượng tỏa nhiệt; đèn LED chuyển trực tiếp điện năng thành quang năng qua chất bán dẫn nên hiệu suất rất cao."},{"id":"th-14","code":"TH-14","level":"hieu","topic":"Luyện kim, cơ khí","question":"Trong phương pháp đúc ly tâm, lực ly tâm có tác dụng gì đối với kim loại lỏng?","options":["Làm kim loại bay hơi nhanh hơn","Đẩy kim loại lỏng ép chặt vào thành khuôn quay tròn giúp tạo sản phẩm rỗng ruột đồng đều (như ống đúc)","Làm nguội kim loại tức thì","Ngăn không cho kim loại kết tinh"],"correctIndex":1,"explanation":"Đúc ly tâm rót kim loại lỏng vào khuôn đang quay nhanh, lực ly tâm ép kim loại lỏng ra thành ngoài tạo thành vật đúc dạng ống rỗng ruột sít chặt."},{"id":"th-15","code":"TH-15","level":"hieu","topic":"Luyện kim, cơ khí","question":"Phân biệt giữa hàn nóng chảy và hàn áp lực:","options":["Hàn nóng chảy nung mép kim loại đến chảy lỏng hoàn toàn; hàn áp lực nung dẻo rồi dùng ngoại lực ép dính","Hàn nóng chảy không cần que hàn, hàn áp lực luôn dùng que hàn","Hàn nóng chảy chỉ dùng cho gỗ, hàn áp lực dùng cho sắt thép","Hàn nóng chảy làm lạnh bằng nước, hàn áp lực làm nóng bằng lò sưởi"],"correctIndex":0,"explanation":"Hàn nóng chảy nung chỗ hàn đến trạng thái lỏng; còn hàn áp lực nung nóng đến trạng thái dẻo rồi dùng ngoại lực ép lại."},{"id":"th-16","code":"TH-16","level":"hieu","topic":"Điện - điện tử","question":"Nguyên lý cơ bản biến đổi điện năng thành cơ năng trong động cơ điện dựa trên:","options":["Hiện tượng tán sắc ánh sáng","Hiện tượng cảm ứng điện từ (tương tác giữa từ trường của stato và dòng điện trong roto)","Hiện tượng ma sát tĩnh điện","Hiện tượng phân rã hạt nhân"],"correctIndex":1,"explanation":"Động cơ điện hoạt động dựa trên hiện tượng cảm ứng điện từ, khi dòng điện qua cuộn dây đặt trong từ trường sẽ sinh ra lực từ làm roto quay."},{"id":"th-17","code":"TH-17","level":"hieu","topic":"Điện - điện tử","question":"Máy sấy tóc thuộc loại thiết bị điện - cơ nào?","options":["Thiết bị điện - cơ dạng tịnh tiến","Thiết bị điện - cơ dạng quay (động cơ điện quay cánh quạt thổi gió qua cuộn dây nhiệt)","Thiết bị điện - quang thuần túy","Thiết bị truyền thông không dây"],"correctIndex":1,"explanation":"Máy sấy tóc gồm một động cơ điện quay gắn cánh quạt hút và đẩy luồng không khí qua sợi đốt."},{"id":"th-18","code":"TH-18","level":"hieu","topic":"Điện - điện tử","question":"Tại sao van điện từ (solenoid) lại được xếp vào nhóm điện - cơ dạng tịnh tiến?","options":["Vì van chuyển động xoay tròn liên tục 360 độ","Vì khi có điện, cuộn dây tạo từ trường hút lõi thép di chuyển dọc trục tịnh tiến để đóng/mở cửa van","Vì van phát ra ánh sáng huỳnh quang","Vì van truyền sóng Wi-Fi"],"correctIndex":1,"explanation":"Lực từ trường tác dụng kéo hoặc đẩy lõi van chuyển động thẳng tới lui (tịnh tiến) để đóng hoặc mở đường dẫn chất lỏng/khí."},{"id":"th-19","code":"TH-19","level":"hieu","topic":"Điện - điện tử","question":"Nhà máy thủy điện biến đổi năng lượng theo chu trình nào?","options":["Nhiệt năng của than -> cơ năng -> điện năng","Thế năng (và động năng) của dòng nước chảy -> cơ năng quay tua-bin -> máy phát điện tạo điện năng","Năng lượng ánh sáng -> pin quang điện -> điện năng","Năng lượng gió -> điện phân nước -> điện năng"],"correctIndex":1,"explanation":"Nước từ hồ chứa trên cao chảy xuống làm quay tuabin nước, tuabin kéo máy phát điện quay sinh ra dòng điện."},{"id":"th-20","code":"TH-20","level":"hieu","topic":"Điện - điện tử","question":"Công nghệ hàn hồ quang MAG (Metal Active Gas) là công nghệ hàn trong môi trường khí gì?","options":["Khí bảo vệ hoạt tính (thường là CO2 hoặc trộn Ar + CO2)","Khí oxi nguyên chất","Khí hidro cháy","Khí heli không màu"],"correctIndex":0,"explanation":"MAG là hàn hồ quang kim loại trong môi trường khí bảo vệ hoạt tính (Active Gas), phổ biến nhất là khí CO2 để bảo vệ mối hàn khỏi oxi hóa."},{"id":"th-21","code":"TH-21","level":"hieu","topic":"Luyện kim, cơ khí","question":"Điểm khác biệt giữa cán nóng và cán nguội trong công nghệ cán kim loại là:","options":["Cán nóng thực hiện khi kim loại được nung trên nhiệt độ kết tinh lại, cán nguội thực hiện ở nhiệt độ phòng","Cán nóng chỉ làm việc với nhôm, cán nguội chỉ làm việc với vàng","Cán nóng không dùng trục quay, cán nguội dùng 4 trục","Cán nguội làm kim loại chảy thành nước"],"correctIndex":0,"explanation":"Cán nóng biến dạng kim loại ở nhiệt độ cao (giảm lực cán), cán nguội thực hiện ở nhiệt độ thấp cho độ chính xác và bề mặt sáng bóng."},{"id":"th-22","code":"TH-22","level":"hieu","topic":"Điện - điện tử","question":"Nguyên lý phát sáng của đèn huỳnh quang (phóng điện) là gì?","options":["Đốt nóng sợi vonfram đến nhiệt độ phát quang","Phóng điện giữa 2 điện cực trong hơi thủy ngân tạo tia tử ngoại, kích thích lớp bột huỳnh quang phát ra ánh sáng nhìn thấy","Dòng điện đi qua lớp bán dẫn p-n","Phản ứng cháy của phốt pho với không khí"],"correctIndex":1,"explanation":"Khi điện áp đặt vào hai cực, phóng điện xảy ra tạo tia tử ngoại tác dụng vào lớp bột huỳnh quang phủ trong ống thủy tinh phát ra ánh sáng."},{"id":"th-23","code":"TH-23","level":"hieu","topic":"Luyện kim, cơ khí","question":"Trong các công nghệ sau, công nghệ nào tạo ra phế phẩm dưới dạng \"bavia\" hoặc \"phoi cắt\"?","options":["Gia công cắt gọt kim loại","Công nghệ truyền tải điện","Công nghệ sản xuất điện gió","Công nghệ chiếu sáng LED"],"correctIndex":0,"explanation":"Gia công cắt gọt bóc tách lớp vật liệu thừa trên phôi kim loại tạo thành các phoi cắt (phoi vụn, phoi dây,...)."},{"id":"th-24","code":"TH-24","level":"hieu","topic":"Điện - điện tử","question":"Sự khác nhau về phạm vi truyền sóng giữa Bluetooth và Wi-Fi là:","options":["Bluetooth truyền khoảng cách ngắn (thường dưới 10m - 15m), Wi-Fi phủ sóng rộng hơn (vài chục đến hàng trăm mét) và tốc độ cao hơn","Bluetooth truyền hàng nghìn kilomet, Wi-Fi chỉ truyền trong phòng ngủ","Bluetooth dùng dây cáp quang, Wi-Fi dùng vệ tinh","Bluetooth không dùng sóng vô tuyến"],"correctIndex":0,"explanation":"Bluetooth thiết kế kết nối các thiết bị cá nhân ở khoảng cách gần, Wi-Fi dùng mạng cục bộ không dây phạm vi rộng hơn và lưu lượng lớn."},{"id":"th-25","code":"TH-25","level":"hieu","topic":"Điện - điện tử","question":"Tại sao việc tự động hóa dây chuyền lắp ráp ô tô bằng robot lại mang lại hiệu quả vượt trội?","options":["Robot làm việc liên tục, độ chuẩn xác đồng đều cao, đảm bảo an toàn trong môi trường độc hại nặng nhọc","Robot không cần cung cấp điện năng khi vận hành","Robot tự sinh ra sắt thép để làm vỏ xe","Robot chỉ có thể sơn màu trắng"],"correctIndex":0,"explanation":"Dây chuyền tự động hóa giúp các thao tác con người được thay thế bằng cánh tay robot, tăng năng suất, giảm chi phí nhân công và an toàn tuyệt đối."},{"id":"th-26","code":"TH-26","level":"hieu","topic":"Luyện kim, cơ khí","question":"Hình thức \"Rèn\" trong gia công áp lực được chia thành 2 hình thức chính là:","options":["Rèn tự do và rèn khuôn (dập thể tích)","Rèn nóng và rèn bằng laser","Rèn bằng tay và rèn trong nước","Rèn điện và rèn hóa"],"correctIndex":0,"explanation":"Rèn chia thành rèn tự do (biến dạng không bị hạn chế bởi lòng khuôn) và rèn khuôn (dập trong lòng khuôn định hình sẵn)."},{"id":"th-27","code":"TH-27","level":"hieu","topic":"Điện - điện tử","question":"Công nghệ truyền tải điện năng đi xa dùng điện áp rất cao (đường dây cao thế 500kV, 220kV) nhằm mục đích chính là:","options":["Giảm hao phí do tỏa nhiệt trên đường dây truyền tải điện","Làm dây điện phát sáng ban đêm","Tăng điện trở của dây dẫn","Làm giảm tốc độ lan truyền của dòng điện"],"correctIndex":0,"explanation":"Hao phí trên đường dây tỉ lệ nghịch với bình phương hiệu điện thế (P_hp = R * P^2 / U^2). Nâng U lên cao sẽ giảm hao phí truyền tải rất nhiều."},{"id":"th-28","code":"TH-28","level":"hieu","topic":"Luyện kim, cơ khí","question":"Hạn chế lớn nhất của công nghệ đúc trong khuôn cát là gì so với đúc trong khuôn kim loại?","options":["Độ bóng bề mặt và độ chính xác kích thước thấp hơn, khuôn chỉ dùng được 1 lần (phải phá vỡ sau đúc)","Không thể đúc các chi tiết lớn","Nhiệt độ nóng chảy của cát quá thấp","Chi phí cát đắt hơn kim loại"],"correctIndex":0,"explanation":"Đúc khuôn cát có ưu điểm đúc được chi tiết lớn phức tạp nhưng bề mặt thô nhám, độ chính xác không cao và khuôn bị phá hủy sau khi lấy vật đúc."},{"id":"th-29","code":"TH-29","level":"hieu","topic":"Luyện kim, cơ khí","question":"Trong các sản phẩm sau, sản phẩm nào được chế tạo trực tiếp bằng công nghệ hàn?","options":["Cổng sắt hoa văn, giàn giáo xây dựng, khung nhà thép tiền chế","Thanh ray đường sắt đúc nguyên khối","Lưỡi cưa gỗ dập nổi","Bóng đèn compact"],"correctIndex":0,"explanation":"Cổng sắt hoa văn, bàn ghế sắt, giàn giáo xây dựng, khung thép nhà máy được liên kết chắc chắn bằng công nghệ hàn."},{"id":"th-30","code":"TH-30","level":"hieu","topic":"Nghề nghiệp & Đời sống","question":"Kĩ sư mạng máy tính và truyền thông dữ liệu đảm nhận công việc chính nào?","options":["Nghiên cứu nguyên lí mạng, thiết kế, xây dựng và quản trị hệ thống mạng từ nội bộ đến diện rộng","Nấu quặng sắt trong lò cao","Hàn ống nước ngầm bằng khí MAG","Tiện ren ốc trên máy tiện cơ khí"],"correctIndex":0,"explanation":"Kĩ sư mạng máy tính thiết kế, xây dựng và vận hành hệ thống mạng máy tính từ mạng nội bộ (LAN) đến mạng diện rộng (WAN, Internet)."},{"id":"vd-01","code":"VD-01","level":"van_dung","topic":"Điện - điện tử","question":"Để lắp đặt hệ thống đèn chiếu sáng cho một trường học nhằm tối ưu hóa chi phí tiền điện lâu dài và bảo vệ thị lực cho học sinh, loại đèn nào là lựa chọn tốt nhất?","options":["Đèn LED hiện đại","Đèn sợi đốt Edison","Đèn dầu hỏa","Đèn khí cacbon"],"correctIndex":0,"explanation":"Đèn LED tiết kiệm tới 60-80% điện năng so với sợi đốt, phát sáng êm dịu, không nhấp nháy tần số thấp, tuổi thọ bền bỉ từ 30.000 đến 50.000 giờ."},{"id":"vd-02","code":"VD-02","level":"van_dung","topic":"Luyện kim, cơ khí","question":"Để sản xuất hàng loạt thân động cơ xe máy hoặc vỏ hộp số ô tô có hình dạng rỗng và gân gia cường phức tạp, người ta ưu tiên sử dụng công nghệ nào đầu tiên để tạo phôi?","options":["Công nghệ đúc kim loại (đúc áp lực hoặc đúc khuôn kim loại)","Công nghệ hàn que","Công nghệ kéo sợi","Công nghệ rèn tự do bằng tay"],"correctIndex":0,"explanation":"Công nghệ đúc kim loại (đặc biệt đúc áp lực khuôn kim loại) là lựa chọn tối ưu để tạo các chi tiết phức tạp như vỏ máy, lốc động cơ."},{"id":"vd-03","code":"VD-03","level":"van_dung","topic":"Luyện kim, cơ khí","question":"Để gia công trục tròn xoay của một máy bơm nước đạt độ tròn và độ bóng bề mặt cao, thợ cơ khí sẽ sử dụng phương pháp gia công cắt gọt nào?","options":["Công nghệ tiện kết hợp mài tinh","Công nghệ hàn nóng chảy","Công nghệ rèn tự do","Công nghệ đúc khuôn cát"],"correctIndex":0,"explanation":"Chi tiết tròn xoay (như trục máy, bu lông) được gia công chủ yếu trên máy tiện, sau đó mài bóng để đạt độ chính xác bề mặt cao."},{"id":"vd-04","code":"VD-04","level":"van_dung","topic":"Luyện kim, cơ khí","question":"Để sản xuất dây điện bằng đồng có đường kính nhỏ 1mm và chiều dài hàng trăm mét từ thanh phôi đồng lớn, xí nghiệp phải ứng dụng công nghệ gia công áp lực nào?","options":["Công nghệ kéo kim loại qua lỗ khuôn","Công nghệ hàn hồ quang","Công nghệ phay rãnh xoắn","Công nghệ đúc ly tâm"],"correctIndex":0,"explanation":"Kéo kim loại là sự kéo dài phôi qua chuỗi lỗ khuôn có đường kính nhỏ dần để tạo ra dây kim loại có tiết diện nhỏ và chiều dài không hạn chế."},{"id":"vd-05","code":"VD-05","level":"van_dung","topic":"Luyện kim, cơ khí","question":"Tại sao trong các nhà xưởng cơ khí hiện đại, người ta thường dùng máy hàn MAG có khí CO2 bảo vệ thay cho que hàn thuốc bọc truyền thống khi hàn kết cấu dày?","options":["Mối hàn sạch, ít xỉ, tốc độ hàn nhanh, độ ngấu sâu và năng suất cao hơn hẳn","Hàn MAG không cần nguồn điện","Hàn MAG làm kim loại hóa lỏng ở nhiệt độ âm","Hàn MAG không tạo ra bất kì bức xạ ánh sáng nào"],"correctIndex":0,"explanation":"Hàn MAG trong môi trường khí bảo vệ CO2 cấp dây hàn tự động liên tục, tốc độ hàn cao, mối hàn đẹp, ngấu tốt và ít bám xỉ."},{"id":"vd-06","code":"VD-06","level":"van_dung","topic":"Điện - điện tử","question":"Trong hệ thống bơm nước tự động của gia đình lên bồn nước trên cao, thiết bị điện - cơ nào vừa đóng vai trò cảm ứng ngắt mạch điện khi bồn đầy nước?","options":["Rơ le phao điện (Relay điện từ kết hợp phao ngắt)","Đèn LED tín hiệu","Bóng đèn sợi đốt","Khối nam châm vĩnh cửu"],"correctIndex":0,"explanation":"Rơ le điện từ kết hợp với phao đóng/ngắt mạch điều khiển điện áp an toàn để bật/tắt máy bơm tự động."},{"id":"vd-07","code":"VD-07","level":"van_dung","topic":"Điện - điện tử","question":"Một học sinh muốn nghe nhạc từ điện thoại thông minh sang tai nghe không dây khi đang chạy bộ thể dục. Công nghệ truyền thông không dây phù hợp nhất được tích hợp là:","options":["Công nghệ Bluetooth","Công nghệ cáp truyền hình","Công nghệ mạng cáp quang FTTH","Công nghệ phát sóng vô tuyến AM công suất lớn"],"correctIndex":0,"explanation":"Bluetooth tiêu tốn ít năng lượng, truyền âm thanh ổn định trong khoảng cách ngắn vài mét, rất thích hợp cho tai nghe cá nhân."},{"id":"vd-08","code":"VD-08","level":"van_dung","topic":"Luyện kim, cơ khí","question":"Để chế tạo tôn lợp nhà mạ kẽm có độ dày mỏng đều 0.4mm từ phôi thép tấm dày, nhà máy thép cần thực hiện qua quy trình gia công áp lực nào?","options":["Cán nóng rồi cán nguội qua các trục cán","Rèn khuôn bằng búa máy","Đúc áp lực trong khuôn mẫu chảy","Hàn điện tiếp xúc"],"correctIndex":0,"explanation":"Công nghệ cán thép cho phôi đi qua các cặp trục quay ngược chiều nén phôi mỏng dần đến kích thước yêu cầu (tấm lá mỏng)."},{"id":"vd-09","code":"VD-09","level":"van_dung","topic":"Điện - điện tử","question":"Quan sát các thiết bị gia dụng: (1) Quạt bàn, (2) Máy sấy tóc, (3) Rơ le ngắt nhiệt ấm siêu tốc, (4) Van xả nước tự động của máy giặt. Các thiết bị thuộc nhóm điện - cơ dạng tịnh tiến là:","options":["(3) và (4)","(1) và (2)","(1) và (3)","(2) và (4)"],"correctIndex":0,"explanation":"Quạt bàn và máy sấy tóc là động cơ quay (dạng quay); còn rơ le ngắt nhiệt và van điện từ xả nước chuyển động tịnh tiến lõi sắt (dạng tịnh tiến)."},{"id":"vd-10","code":"VD-10","level":"van_dung","topic":"Điện - điện tử","question":"Khi xây dựng một nhà máy nhiệt điện đốt than, để giảm thiểu ô nhiễm khói bụi và khí độc theo quy chuẩn bảo vệ môi trường, giải pháp kĩ thuật bắt buộc là:","options":["Lắp đặt hệ thống lọc bụi tĩnh điện và tháp xử lý khử khí SO2, NOx trước khi thải ra ống khói","Chôn than trực tiếp xuống lòng đất","Thay nước làm mát bằng dầu nhớt thải","Không dùng ống khói mà xả trực tiếp vào nguồn nước"],"correctIndex":0,"explanation":"Nhiệt điện đốt than sinh nhiều bụi và khí độc, cần trang bị lọc bụi tĩnh điện và tháp hấp phụ khí độc để bảo vệ môi trường sinh thái."},{"id":"vd-11","code":"VD-11","level":"van_dung","topic":"Luyện kim, cơ khí","question":"Để tạo một chiếc cổng sắt nghệ thuật với các thanh uốn cong và hoa văn phức tạp ghép nối bền chặt, người thợ kết hợp những công nghệ nào?","options":["Gia công áp lực (uốn rèn tạo hình hoa văn) và Công nghệ hàn (ghép nối cố định)","Công nghệ đúc khuôn cát và mài phẳng","Công nghệ kéo sợi và điện phân","Công nghệ tiện trục và cán tấm"],"correctIndex":0,"explanation":"Người thợ uốn nắn hoa văn sắt bằng gia công áp lực (uốn, dập rèn mỹ thuật) sau đó dùng công nghệ hàn để liên kết thành khung cổng vững chắc."},{"id":"vd-12","code":"VD-12","level":"van_dung","topic":"Điện - điện tử","question":"Tại các vùng đồi núi có địa hình dốc và dòng sông có lưu lượng nước lớn quanh năm, phương thức sản xuất điện năng nào tận dụng tối đa điều kiện tự nhiên?","options":["Công nghệ thủy điện","Công nghệ nhiệt điện khí hóa lỏng","Công nghệ điện hạt nhân","Công nghệ nhiệt điện than"],"correctIndex":0,"explanation":"Địa hình đồi núi dốc tạo cột nước cao và lưu lượng lớn, là điều kiện lý tưởng để xây dựng đập tích nước và nhà máy thủy điện."},{"id":"vd-13","code":"VD-13","level":"van_dung","topic":"Luyện kim, cơ khí","question":"Ống dẫn dầu bằng gang hình trụ dài rỗng ruột với thành ống dày đều và không có đường hàn giáp mí thường được sản xuất bằng phương pháp đúc nào?","options":["Công nghệ đúc ly tâm","Công nghệ đúc mẫu sáp chảy","Công nghệ rèn tay tự do","Công nghệ hàn ghép tấm mỏng"],"correctIndex":0,"explanation":"Đúc ly tâm là phương pháp chuyên dùng sản xuất các ống kim loại tròn rỗng (như ống nước, ống dẫn dầu gang) cho mật độ vật liệu sít chặt và không có mối hàn."},{"id":"vd-14","code":"VD-14","level":"van_dung","topic":"Điện - điện tử","question":"Một nông trại trồng thanh long nghịch vụ cần thắp sáng ban đêm hàng nghìn bóng đèn. Tại sao chuyển đổi từ đèn sợi đốt sang đèn LED chuyên dụng giúp nhà nông tăng lợi nhuận?","options":["Giảm hơn 70% tiền điện mỗi tháng, tuổi thọ bóng lâu năm ít hỏng hóc và bước sóng ánh sáng kích thích ra hoa tối ưu","Đèn LED tạo ra nhiều nhiệt sưởi ấm quả thanh long chín nhanh hơn","Đèn LED không cần dùng điện lưới","Đèn LED phát ra tia phóng xạ diệt sâu bọ"],"correctIndex":0,"explanation":"Đèn LED giúp tiết kiệm đáng kể chi phí tiền điện, bền hơn trước mưa gió ngoài đồng, hiệu quả kinh tế cao vượt trội so với đèn sợi đốt."},{"id":"vd-15","code":"VD-15","level":"van_dung","topic":"Luyện kim, cơ khí","question":"Để cắt các tấm thép dày 50mm dùng làm thân tàu thủy với đường cắt hình học uốn lượn phức tạp một cách nhanh chóng, công nghệ gia công hiện đại nào thường được sử dụng?","options":["Cắt bằng tia nước áp lực cao trộn hạt mài hoặc công nghệ cắt Plasma/Laser CNC","Cưa tay bằng lưỡi cưa sắt","Đục bằng búa và đục tay","Khoan lỗ thủ công"],"correctIndex":0,"explanation":"Cắt Plasma CNC, Laser công suất lớn hoặc tia nước áp lực cao cho phép cắt thép tấm dày chính xác theo biên dạng bản vẽ số hóa."},{"id":"vd-16","code":"VD-16","level":"van_dung","topic":"Điện - điện tử","question":"Trong ô tô thông minh, cảm biến lùi phát hiện chướng ngại vật rồi truyền tín hiệu điều khiển kích hoạt hệ thống tự động phanh. Đây là ứng dụng tiêu biểu của:","options":["Công nghệ điều khiển và tự động hóa","Công nghệ luyện kim màu","Công nghệ gia công áp lực","Công nghệ đúc ly tâm"],"correctIndex":0,"explanation":"Hệ thống phanh khẩn cấp tự động là một chuỗi điều khiển tự động hóa khép kín: Cảm biến -> Bộ vi xử lý -> Cơ cấu chấp hành phanh an toàn."},{"id":"vd-17","code":"VD-17","level":"van_dung","topic":"Luyện kim, cơ khí","question":"Để nâng cao cơ tính (độ cứng, độ bền mài mòn) của một chiếc bánh răng thép sau khi đã gia công cắt gọt xong, quy trình xử lý nhiệt luyện tiếp theo là:","options":["Nung nóng rồi tôi cứng bề mặt và ram tôi","Ngâm bánh răng vào nước lạnh ngay từ đầu","Cán mỏng bánh răng qua 2 trục quay","Nấu chảy bánh răng đổ vào khuôn cát"],"correctIndex":0,"explanation":"Sau khi gia công răng, bánh răng được nhiệt luyện (tôi cứng và ram) để bề mặt răng cứng chống mài mòn mà lõi vẫn dai chịu tải va đập."},{"id":"vd-18","code":"VD-18","level":"van_dung","topic":"Điện - điện tử","question":"Tại sao mạng di động thế hệ mới 5G lại được xem là chìa khóa mở đường cho xe tự hành (xe không người lái) và phẫu thuật từ xa?","options":["Tốc độ truyền dữ liệu siêu cao và độ trễ cực thấp (dưới 1ms), phản hồi tức thì theo thời gian thực","Sóng 5G biến pin xe điện thành pin vĩnh cửu","5G không cần trạm thu phát sóng trên mặt đất","5G chỉ dùng được vào ban ngày"],"correctIndex":0,"explanation":"Ưu thế then chốt của 5G là băng thông cực lớn và độ trễ phản hồi siêu thấp (ultra-low latency), giúp thiết bị ra quyết định tức thì, bảo đảm an toàn tính mạng."},{"id":"vd-19","code":"VD-19","level":"van_dung","topic":"Luyện kim, cơ khí","question":"Dụng cụ nhà bếp nào sau đây thường được đúc nguyên khối từ gang vì tính giữ nhiệt lâu và chịu nhiệt cao?","options":["Chảo gang, nồi kho tộ bằng gang","Dao gọt hoa quả bằng sứ mỏng","Bình thủy tinh chịu nhiệt","Thìa nhựa ăn dặm"],"correctIndex":0,"explanation":"Nồi chảo gang đúc có độ dày dặn, khả năng tích nhiệt và tỏa nhiệt đều, rất bền bỉ trong nấu nướng."},{"id":"vd-20","code":"VD-20","level":"van_dung","topic":"Điện - điện tử","question":"Một học sinh thiết kế mô hình nhà thông minh có đèn tự động sáng khi trời tối. Học sinh đó cần phối hợp các công nghệ nào?","options":["Cảm biến ánh sáng quang trở + Mạch điều khiển đóng ngắt + Đèn LED     class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      click() {
        if (this.muted) return;
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch(e) {}
      }
      correct(streak = 1) {

          this.init();
          const base = 523.25;

            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.07);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.07);

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

          topic: q.topic,
          question: q.question,
          options: shuffledOpts,
          correctIndex: shuffledOpts.indexOf(correctText),

    function selectAvatar(av) {
      sound.click();
      document.getElementById('chosenAvatar').value = av;
      document.querySelectorAll('.avatar-btn').forEach(b => {
        b.className = 'avatar-btn w-11 h-11 text-xl rounded-2xl flex items-center justify-center transition bg-slate-100 hover:bg-slate-200 text-slate-700';
      });
      const el = document.getElementById('av-' + av);
      if (el) el.className = 'avatar-btn w-11 h-11 text-xl rounded-2xl flex items-center justify-center transition bg-indigo-600 text-white ring-2 ring-indigo-400 scale-110';
    }

    function selectClass(cls) {
      sound.click();
      document.getElementById('studentClassInput').value = cls;
      document.querySelectorAll('.class-btn').forEach(b => {
        b.className = 'class-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-600 hover:bg-slate-200';
      });
      const el = document.getElementById('cls-' + cls);
      if (el) el.className = 'class-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition bg-indigo-600 text-white shadow-sm';
    }

    function handleStartExam(e) {
      e.preventDefault();
      const name = document.getElementById('studentNameInput').value.trim();
      const cls = document.getElementById('studentClassInput').value.trim();
      const av = document.getElementById('chosenAvatar').value;

      if (!name || !cls) return;
      sound.click();

      activeStudent = {
        name: av + ' ' + name,
        studentClass: cls
      };

      activeExam = generateExam();
      currentQIndex = 0;
      points = 0;
      streak = 0;
      maxStreak = 0;
      examAnswers = [];
      completedSubmission = null;
      startQuestion();
    }

    function startQuestion() {
      timeLeft = 25;
      currentSelectedOption = null;
      isCurrentAnswered = false;
      questionStartTime = Date.now();

      if (currentTimer) clearInterval(currentTimer);
      currentTimer = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(currentTimer);
          handleAnswer(-1);
        } else {
          updateTimerBar();
        }
      }, 1000);

      render();
    }

    function updateTimerBar() {
      const bar = document.getElementById('timerProgressBar');
      const text = document.getElementById('timerText');
      if (bar) bar.style.width = ((timeLeft / 25) * 100) + '%';
      if (text) text.innerText = timeLeft + 's';
    }

    function handleAnswer(optIdx) {
      if (isCurrentAnswered) return;
      if (currentTimer) clearInterval(currentTimer);

      isCurrentAnswered = true;
      currentSelectedOption = optIdx;

      const q = activeExam.questions[currentQIndex];
      const isCorrect = optIdx === q.correctIndex;
      const timeTaken = Math.max(1, Math.round((Date.now() - questionStartTime) / 1000));

      if (isCorrect) {
        streak++;
        if (streak > maxStreak) maxStreak = streak;
        const speedBonus = Math.round((timeLeft / 25) * 500);
        points += 1000 + speedBonus + Math.min(1000, streak * 150);
        sound.correct(streak);
      } else {
        streak = 0;
        sound.wrong();
      }

      examAnswers.push({
        questionId: q.id,
        questionText: q.question,
        level: q.level,
        options: q.options,
        selectedOptionIndex: optIdx,
        correctOptionIndex: q.correctIndex,
        isCorrect,
        explanation: q.explanation,
        timeTakenSeconds: timeTaken
      });

      render();
    }

    function nextQuestion() {
      sound.click();
      if (currentQIndex + 1 < activeExam.questions.length) {
        currentQIndex++;
        startQuestion();
      } else {
        finishExam();
      }
    }

    function finishExam() {
      if (currentTimer) clearInterval(currentTimer);
      
      const correctCount = examAnswers.filter(a => a.isCorrect).length;
      const totalCount = activeExam.questions.length;
      const totalScore = Math.round((correctCount / totalCount) * 10 * 10) / 10;
      const totalTime = examAnswers.reduce((acc, a) => acc + a.timeTakenSeconds, 0);

      completedSubmission = {
        id: 'sub-' + Date.now(),
        studentName: activeStudent.name,
        studentClass: activeStudent.studentClass,
        examCode: activeExam.examCode,
        submittedAt: new Date().toISOString(),
        totalScore,
        correctCount,
        totalCount,
        breakdown: {
          biet: { correct: examAnswers.filter(a => a.level === 'biet' && a.isCorrect).length, total: examAnswers.filter(a => a.level === 'biet').length },
          hieu: { correct: examAnswers.filter(a => a.level === 'hieu' && a.isCorrect).length, total: examAnswers.filter(a => a.level === 'hieu').length },
          van_dung: { correct: examAnswers.filter(a => a.level === 'van_dung' && a.isCorrect).length, total: examAnswers.filter(a => a.level === 'van_dung').length }
        },
        timeSpentSeconds: totalTime,
        gamifiedScore: points,
        maxStreak,
        answers: examAnswers
      };

      submissions.unshift(completedSubmission);
      localStorage.setItem('quiz_student_submissions_v1', JSON.stringify(submissions));

      activeExam = null;
      render();

      if (totalScore >= 5.0) {
        sound.victory();
        if (window.confetti) {
          window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
      }
    }

              </div>

                <div id="timerProgressBar" class="h-full rounded-full bg-gradient-to-r from-emerald-500 to-indigo-500 transition-all duration-1000" style="width: ${(timeLeft / 25) * 100}%"></div>
              </div>
            </div>
          </div>

          <div class="bg-white border border-slate-200/90 rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/50 mb-6">
            <div class="text-xs uppercase font-bold tracking-wider text-indigo-600 mb-2 flex items-center gap-2">
              <span>📖 Chủ đề: ${q.topic}</span>
              <span class="text-slate-300">•</span>
              <span class="text-slate-500 font-mono">Mã: ${q.code}</span>
            </div>
            <h2 class="text-lg sm:text-2xl font-bold text-slate-900 leading-relaxed">
              ${q.question}
            </h2>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
            ${q.options.map((opt, idx) => {
              const s = optStyles[idx];
              let btnClass = s.bg + ' text-white shadow-md';
              if (isCurrentAnswered) {
                if (idx === q.correctIndex) {
                  btnClass = 'bg-emerald-600 ring-4 ring-emerald-300 text-white scale-102';
                } else if (idx === currentSelectedOption && idx !== q.correctIndex) {
                  btnClass = 'bg-rose-600 text-white line-through opacity-70';
                } else {
                  btnClass = 'bg-slate-200 text-slate-500 opacity-40 shadow-none';
                }
              }

              return `
                <button onclick="handleAnswer(${idx})" ${isCurrentAnswered ? 'disabled' : ''} class="${btnClass} relative p-5 sm:p-6 rounded-2xl font-bold text-left transition-all cursor-pointer">
                  <div class="flex items-start space-x-3.5">
                    <span class="w-8 h-8 rounded-xl bg-black/15 flex items-center justify-center font-black text-sm shrink-0">${s.sym}</span>
                    <div class="flex-1">
                      <span class="text-xs opacity-80 font-semibold block mb-0.5">Phương án ${s.label}:</span>
                      <span class="text-sm sm:text-base leading-snug">${opt}</span>

          </div>

          ${isCurrentAnswered ? `
            <div class="p-6 rounded-3xl border mb-6 shadow-xl ${isCorrect ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'}">
              <div class="flex items-center justify-between mb-3">
                <span class="font-extrabold text-lg sm:text-xl ${isCorrect ? 'text-emerald-800' : 'text-rose-800'}">
                  ${isCorrect ? '✓ CHÍNH XÁC! TUYỆT VỜI 🎉' : '✗ CHƯA CHÍNH XÁC! 💡'}
                </span>
                <button onclick="nextQuestion()" class="py-2.5 px-6 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 font-extrabold text-sm sm:text-base shadow-md cursor-pointer">
                  ${currentQIndex + 1 < activeExam.questions.length ? 'CÂU TIẾP THEO ➔' : 'XEM KẾT QUẢ ➔'}

                ${q.explanation}

        </div>

              </div>
              <div class="p-4 rounded-2xl bg-sky-50 border border-sky-200">
                <div class="text-xs font-bold text-sky-800 uppercase mb-1">Mức Hiểu (3 câu)</div>
                <div class="text-2xl font-black text-slate-900">${s.breakdown.hieu.correct} / ${s.breakdown.hieu.total}</div>
              </div>
              <div class="p-4 rounded-2xl bg-purple-50 border border-purple-200">
                <div class="text-xs font-bold text-purple-800 uppercase mb-1">Mức Vận Dụng (3 câu)</div>
                <div class="text-2xl font-black text-slate-900">${s.breakdown.van_dung.correct} / ${s.breakdown.van_dung.total}</div>
              </div>
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-center gap-3 mb-10 no-print">
            <button onclick="setTab('student')" class="py-3 px-6 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold text-sm sm:text-base shadow-md cursor-pointer">
              THI ĐỀ MỚI (TẠO ĐỀ KHÁC)
            </button>
            <button onclick="setTab('leaderboard')" class="py-3 px-6 rounded-2xl bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-sm sm:text-base shadow-md cursor-pointer">
              BẢNG VINH DANH
            </button>
            <button onclick="window.print()" class="py-3 px-4 rounded-2xl bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm border border-slate-300 shadow-sm cursor-pointer">
              🖨️ In Kết Quả
            </button>
          </div>

          <div class="space-y-4">
            <h2 class="text-xl font-bold text-slate-900">Chi Tiết Lời Giải Từng Câu Hỏi (${s.answers.length} câu)</h2>
            ${s.answers.map((ans, idx) => `
              <div class="p-5 rounded-3xl border ${ans.isCorrect ? 'bg-white border-emerald-300 shadow-sm' : 'bg-white border-rose-300 shadow-sm'}">
                <div class="flex items-center justify-between mb-2">
                  <span class="px-2.5 py-1 rounded-xl text-xs font-black bg-slate-100 text-slate-700">Câu ${idx + 1}</span>
                  <span class="text-xs font-bold ${ans.isCorrect ? 'text-emerald-600' : 'text-rose-600'}">${ans.isCorrect ? '✓ Đúng (+1.0đ)' : '✗ Chưa đúng (0đ)'}</span>
                </div>
                <h3 class="font-bold text-slate-900 mb-3">${ans.questionText}</h3>
                <div class="space-y-1.5 mb-3">
                  ${ans.options.map((opt, oIdx) => `
                    <div class="p-2.5 rounded-xl border text-xs sm:text-sm flex items-center justify-between ${oIdx === ans.correctOptionIndex ? 'bg-emerald-50 border-emerald-400 text-emerald-950 font-bold' : oIdx === ans.selectedOptionIndex ? 'bg-rose-50 border-rose-400 text-rose-950 line-through' : 'bg-slate-50 border-slate-200 text-slate-600'}">
                      <span>${['A', 'B', 'C', 'D'][oIdx]}. ${opt}</span>
                      ${oIdx === ans.correctOptionIndex ? '<span class="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded font-black">ĐÁP ÁN ĐÚNG</span>' : ''}
                      ${oIdx === ans.selectedOptionIndex && oIdx !== ans.correctOptionIndex ? '<span class="text-[10px] bg-rose-600 text-white px-2 py-0.5 rounded font-black">EM CHỌN</span>' : ''}
                    </div>
                  `).join('')}
                </div>
                <div class="p-3 rounded-2xl bg-indigo-50 border border-indigo-200 text-xs text-indigo-950">
                  <strong>💡 Lời giải:</strong> ${ans.explanation}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderLeaderboard() {
      const sorted = [...submissions].sort((a, b) => b.totalScore - a.totalScore || (b.gamifiedScore || 0) - (a.gamifiedScore || 0));
      return `
        <div class="max-w-4xl mx-auto px-4 py-6 sm:py-10">
          <div class="text-center mb-8">
            <div class="inline-flex items-center space-x-2 px-3.5 py-1 rounded-full bg-amber-50 text-amber-700 text-xs font-bold mb-3 border border-amber-200">
              <span>🏆 BẢNG XẾP HẠNG & VINH DANH HỌC SINH</span>
            </div>
            <h1 class="text-2xl sm:text-4xl font-black text-slate-900 tracking-tight">Top Thí Sinh Đạt Điểm Cao Nhất</h1>
            <p class="text-sm text-slate-500 mt-2">Môn Công nghệ 10 - Bài 3: Công nghệ phổ biến • Giáo viên: Cô Mai Hằng</p>
          </div>

          <div class="space-y-3">
            ${sorted.map((item, idx) => `
              <div class="p-4 sm:p-5 rounded-2xl border flex items-center justify-between ${idx === 0 ? 'bg-amber-50/70 border-amber-300 shadow-md' : 'bg-white border-slate-200'}">
                <div class="flex items-center space-x-3.5">
                  <span class="text-xl w-8 text-center">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '#' + (idx + 1)}</span>
                  <div>
                    <div class="flex items-center space-x-2">
                      <span class="font-extrabold text-slate-900">${item.studentName}</span>
                      <span class="px-2 py-0.5 rounded-lg text-xs font-bold bg-indigo-100 text-indigo-700">${item.studentClass}</span>
                    </div>
                    <div class="text-xs text-slate-500 mt-0.5">Đúng ${item.correctCount}/${item.totalCount} câu • Mã đề: ${item.examCode}</div>
                  </div>
                </div>
                <div class="text-right">
                  <div class="text-2xl font-black text-emerald-600">${item.totalScore.toFixed(1)} <span class="text-xs text-slate-400">đ</span></div>
                  <div class="text-xs text-purple-700 font-bold">${(item.gamifiedScore || 0).toLocaleString()} pts</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderTeacherPortal(b, h, vd) {
      if (!isTeacherLoggedIn) {
        return `
          <div class="max-w-md mx-auto px-4 py-12">
            <div class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/50">
              <div class="text-center mb-6">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center mx-auto mb-3 text-2xl text-white">
                  🔒
                </div>
                <h2 class="text-2xl font-black text-slate-900">Đăng Nhập Giáo Viên</h2>
                <p class="text-xs text-slate-500 mt-1">Dành riêng cho giáo viên bộ môn Công nghệ 10</p>
              </div>

              <div id="loginErrBox" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold">
                ⚠️ Tên đăng nhập hoặc mật khẩu không chính xác!
              </div>

              <form onsubmit="handleTeacherLogin(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Tài khoản giáo viên</label>
                  <input type="text" id="tUser" required placeholder="Nhập tên tài khoản..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Mật khẩu</label>
                  <input type="password" id="tPass" required placeholder="Nhập mật khẩu..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white" />
                </div>
                <button type="submit" class="w-full py-3 px-4 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-extrabold text-sm shadow-md cursor-pointer">
                  ĐĂNG NHẬP HỆ THỐNG
                </button>
              </form>
            </div>
          </div>
        `;
      }

      return `
        <div class="max-w-7xl mx-auto px-4 py-6 sm:py-8">
          <div class="bg-gradient-to-r from-purple-50 via-white to-indigo-50 border border-purple-200 rounded-3xl p-6 shadow-sm mb-6 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3.5">
              <div class="w-12 h-12 rounded-2xl bg-purple-100 border border-purple-300 flex items-center justify-center text-2xl">
                👩‍🏫
              </div>
              <div>
                <h1 class="text-xl sm:text-2xl font-black text-slate-900">Khu Vực Quản Trị Giáo Viên: Cô Mai Hằng</h1>
                <p class="text-xs text-slate-500">Môn: Công nghệ 10 • Quản lý ngân hàng ${questions.length} câu hỏi & theo dõi điểm số</p>
              </div>
            </div>
            <button onclick="teacherLogout()" class="px-4 py-2 rounded-xl bg-white hover:bg-slate-100 text-slate-700 text-xs font-bold border border-slate-300 shadow-sm cursor-pointer">
              Đăng xuất
            </button>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
              <div class="text-xs font-bold text-slate-500 uppercase">Tổng câu hỏi</div>
              <div class="text-2xl sm:text-3xl font-black text-slate-900 mt-1">${questions.length} câu</div>
              <div class="text-[11px] text-indigo-600 font-semibold mt-1">${b} Biết • ${h} Hiểu • ${vd} Vận dụng</div>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
              <div class="text-xs font-bold text-slate-500 uppercase">Lượt học sinh thi</div>
              <div class="text-2xl sm:text-3xl font-black text-slate-900 mt-1">${submissions.length} lượt</div>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
              <div class="text-xs font-bold text-slate-500 uppercase">Điểm trung bình</div>
              <div class="text-2xl sm:text-3xl font-black text-amber-600 mt-1">
                ${submissions.length > 0 ? (submissions.reduce((acc, s) => acc + s.totalScore, 0) / submissions.length).toFixed(1) : '0.0'}/10
              </div>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
              <div class="text-xs font-bold text-slate-500 uppercase">Tỷ lệ đạt (≥ 5.0)</div>
              <div class="text-2xl sm:text-3xl font-black text-emerald-600 mt-1">
                ${submissions.length > 0 ? Math.round((submissions.filter(s => s.totalScore >= 5.0).length / submissions.length) * 100) : 0}%
              </div>
            </div>
          </div>

          <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-lg font-bold text-slate-900">Danh Sách Bài Thi Của Học Sinh</h3>
              <button onclick="exportCSV()" class="py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold cursor-pointer">
                📥 Xuất File Excel / CSV
              </button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs sm:text-sm">
                <thead class="bg-slate-50 text-slate-700 font-bold uppercase text-[11px] border-b border-slate-200">
                  <tr>
                    <th class="py-3 px-4">Thí sinh</th>
                    <th class="py-3 px-3">Lớp</th>
                    <th class="py-3 px-3">Mã đề</th>
                    <th class="py-3 px-3 text-center">Điểm số</th>
                    <th class="py-3 px-3 text-center">Biết (/4)</th>
                    <th class="py-3 px-3 text-center">Hiểu (/3)</th>
                    <th class="py-3 px-3 text-center">Vận dụng (/3)</th>
                    <th class="py-3 px-3">Thời gian</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-slate-700">
                  ${submissions.map(sub => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3 px-4 font-bold text-slate-900">${sub.studentName}</td>
                      <td class="py-3 px-3 font-bold text-indigo-600">${sub.studentClass}</td>
                      <td class="py-3 px-3 font-mono text-xs text-slate-500">${sub.examCode}</td>
                      <td class="py-3 px-3 text-center font-extrabold ${sub.totalScore >= 8.0 ? 'text-emerald-700' : 'text-slate-900'}">${sub.totalScore.toFixed(1)}</td>
                      <td class="py-3 px-3 text-center text-emerald-700 font-bold">${sub.breakdown.biet.correct}/4</td>
                      <td class="py-3 px-3 text-center text-sky-700 font-bold">${sub.breakdown.hieu.correct}/3</td>
                      <td class="py-3 px-3 text-center text-purple-700 font-bold">${sub.breakdown.van_dung.correct}/3</td>
                      <td class="py-3 px-3 text-xs">${Math.floor(sub.timeSpentSeconds / 60)}m ${sub.timeSpentSeconds % 60}s</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function handleTeacherLogin(e) {
      e.preventDefault();
      const u = document.getElementById('tUser').value.trim().toLowerCase();
      const p = document.getElementById('tPass').value.trim();

      if (u === 'maihang' && p === '123456hang') {
        sound.correct();
        isTeacherLoggedIn = true;
        render();
      } else {
        sound.wrong();
        document.getElementById('loginErrBox').classList.remove('hidden');
      }
    }

    function exportCSV() {
      if (submissions.length === 0) return alert('Chưa có bài thi nào!');
      const headers = ['STT', 'Họ và tên', 'Lớp', 'Mã đề', 'Điểm tổng', 'Đúng/Tổng', 'Thời gian'];
      const rows = submissions.map((s, idx) => [
        idx + 1,
        '"' + s.studentName + '"',
        s.studentClass,
        s.examCode,
        s.totalScore,
        s.correctCount + '/' + s.totalCount,
        s.timeSpentSeconds + 's'
      ]);
      const csvContent = 'data:text/csv;charset=utf-8,﻿' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const link = document.createElement('a');
      link.setAttribute('href', encodeURI(csvContent));
      link.setAttribute('download', 'Bang_Diem_Hoc_Sinh_Cong_Nghe_10.csv');
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    // Initialize App on load
    render();
  </script>
</body>
</html>
